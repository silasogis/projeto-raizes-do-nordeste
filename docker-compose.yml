services:
  db:
    image: mysql:8.0
    container_name: raizes_nordeste_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass_segura}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-raizes_nordeste_db}
      MYSQL_USER: ${MYSQL_USER:-raizes_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-raizes_pass_segura}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_pass_segura}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

volumes:
  mysql_data:
    name: raizes_nordeste_mysql_data
